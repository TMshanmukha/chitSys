services:
  - type: web
    name: chitsys-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: AUTO_MIGRATE
        value: "true"
      - key: FRONTEND_ORIGIN
        value: "https://*.vercel.app"
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: "test"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: "admin"
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: "admin"
