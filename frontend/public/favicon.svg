<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Golden Coin Ring Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Vibrant Inner Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base for High Contrast on Dark & Light Chrome Tabs -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Subtle Top Specular Glass Highlight -->
  <rect x="3" y="3" width="58" height="27" rx="15" fill="url(#shineGrad)" />

  <!-- Radial Glow Behind Emblem -->
  <circle cx="32" cy="32" r="22" fill="url(#centerGlow)" />

  <!-- Outer Dynamic Chit Pool Cycle Ring -->
  <circle cx="32" cy="32" r="21" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="26 6 12 6" stroke-linecap="round" />

  <!-- Inner Deep Medallion Backdrop -->
  <circle cx="32" cy="32" r="16.5" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="14" fill="#090d1a" />

  <!-- Bold, Crisp Rupee Symbol '₹' Optimized for High Tab Legibility -->
  <path d="M25 21.5 h14 M25 26.5 h12 M29 21.5 v10.5 c3.2 0 6 -0.8 6 -5 c0 -4 -2.8 -5.5 -6 -5.5 M29 32 l7 10.5" 
        stroke="url(#goldGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Luxury Pro Diamond Sparkle in Top-Right -->
  <path d="M48 11.5 L49.5 15 L53 16.5 L49.5 18 L48 21.5 L46.5 18 L43 16.5 L46.5 15 Z" fill="#fef08a" />
</svg>